<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="description" content="Explore websites built by Knovalab for businesses across different industries.">
<title>Knovalab Business — Business Directory</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600&family=Outfit:wght@500;600;700&display=swap" rel="stylesheet">
<style>
:root{--orange:#ff6a00;--orange-hover:#ff7b1c;--bg:#000;--deep:#050505;--alt:#0d0d0d;--card:#141414;--text:#f7f7f7;--muted:#949494;--line:rgba(255,255,255,.075);--tint:#281205;--radius:18px;--side:280px}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--text);font:16px/1.65 Geist,Arial,sans-serif;-webkit-font-smoothing:antialiased}
body.nav-open{overflow:hidden}
h1,h2,h3,h4,p{margin-top:0}
h1,h2,h3{font-family:Outfit,Arial,sans-serif;line-height:1.08;letter-spacing:-.028em;font-weight:600}
p{color:var(--muted)}
a{color:inherit;text-decoration:none}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a:focus-visible,button:focus-visible,input:focus-visible,select:focus-visible,textarea:focus-visible{outline:3px solid rgba(255,106,0,.48);outline-offset:3px}
svg.i{width:18px;height:18px;fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round;flex:none}
.eyebrow{display:flex;align-items:center;gap:11px;color:var(--orange);font-size:.74rem;font-weight:600;letter-spacing:.06em;text-transform:uppercase;margin-bottom:22px}
.eyebrow:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--orange)}

.app{display:grid;grid-template-columns:var(--side) 1fr;min-height:100vh}

/* SIDEBAR */
.sidebar{position:sticky;top:0;height:100vh;background:var(--deep);border-right:1px solid var(--line);display:flex;flex-direction:column;padding:26px 18px 22px;z-index:60}
.brand{display:block;padding:2px 12px 26px}
.brand b{display:block;font:700 1.45rem Outfit,Arial,sans-serif;letter-spacing:-.02em}
.brand small{display:block;margin-top:2px;font-size:.68rem;letter-spacing:.14em;color:var(--muted);font-weight:600;text-transform:uppercase}
.nav-label{padding:22px 12px 10px;font-size:.7rem;letter-spacing:.1em;font-weight:600;color:#666;text-transform:uppercase}
.nav{display:flex;flex-direction:column;gap:3px;overflow-y:auto;min-height:0}
.nav a{position:relative;display:flex;align-items:center;gap:12px;padding:10px 12px;border-radius:10px;color:#999;font-size:.92rem;transition:.2s}
.nav a:hover{background:#111;color:#fff}
.nav a.active{background:#1a0d04;color:#fff}
.nav a.active:before{content:"";position:absolute;left:-18px;top:9px;bottom:9px;width:3px;border-radius:0 3px 3px 0;background:var(--orange)}
.nav a.active svg{color:var(--orange)}
.nav .name{flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.nav .count{font-size:.72rem;color:#777;border:1px solid var(--line);border-radius:999px;padding:0 8px;min-width:26px;text-align:center}
.nav a.active .count{color:var(--orange);border-color:rgba(255,106,0,.3)}
.side-foot{margin-top:auto;padding-top:18px;border-top:1px solid var(--line)}
.powered{margin:0;text-align:center;font-size:.74rem;color:#606060}

/* BUTTONS */
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:46px;padding:0 22px;border:1px solid transparent;border-radius:9px;background:var(--orange);color:#fff;font-weight:600;transition:.2s}
.btn:hover{background:var(--orange-hover);transform:translateY(-2px)}
.btn.secondary{background:transparent;border-color:rgba(255,255,255,.56)}
.btn.secondary:hover{border-color:#fff;background:#111}
.btn.block{width:100%}

/* MAIN */
.main{min-width:0}
.toolbar{height:76px;display:flex;align-items:center;gap:16px;padding:0 48px;background:rgba(0,0,0,.94);backdrop-filter:blur(14px);border-bottom:1px solid var(--line);position:sticky;top:0;z-index:40}
.menu-btn{display:none;background:none;border:1px solid var(--line);border-radius:9px;width:42px;height:42px;align-items:center;justify-content:center;color:#fff}
.crumb{color:#777;font-size:.88rem}
.crumb b{color:#fff;font-weight:500}
.tb-right{margin-left:auto;display:flex;align-items:center;gap:20px}
.tb-right .btn{min-height:40px;padding:0 18px;white-space:nowrap}
.status{display:flex;align-items:center;gap:8px;font-size:.82rem;color:#777}
.status:before{content:"";width:6px;height:6px;border-radius:50%;background:var(--orange)}
.content{max-width:1320px;margin:0 auto;padding:72px 48px 100px}
h1{font-size:clamp(2.6rem,3.6vw,4rem);margin-bottom:20px;max-width:800px}
.lede{max-width:640px;font-size:1.08rem;line-height:1.75;margin-bottom:38px}

.search{position:relative;max-width:700px}
.search .i{position:absolute;left:18px;top:50%;transform:translateY(-50%);color:#777}
.search input{width:100%;height:58px;padding:0 50px;background:var(--card);border:1px solid var(--line);border-radius:12px;outline:none;transition:.2s}
.search input::placeholder{color:#6e6e6e}
.search input:focus{border-color:var(--orange);box-shadow:0 0 0 4px rgba(255,106,0,.12)}
.search .clear{position:absolute;right:12px;top:50%;transform:translateY(-50%);width:32px;height:32px;border-radius:8px;border:0;background:none;color:#777;display:none;align-items:center;justify-content:center}
.search .clear:hover{color:#fff;background:#222}
.search.has-text .clear{display:flex}

.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:20px;margin:38px 0 90px;max-width:700px}
.stats[hidden]{display:none}
.stats[hidden]+.sec-head{margin-top:48px}
.stat{background:var(--card);border:1px solid var(--line);border-radius:var(--radius);padding:24px 26px}
.stat strong{display:block;color:var(--orange);font:700 2.2rem/1 Outfit,Arial,sans-serif;margin-bottom:10px}
.stat span{font-size:.84rem;color:var(--muted)}

.sec-head{display:flex;align-items:flex-end;justify-content:space-between;gap:20px;margin-bottom:34px;flex-wrap:wrap;padding-top:42px;border-top:1px solid var(--line)}
h2{font-size:clamp(1.9rem,2.4vw,2.6rem);margin-bottom:8px}
.sec-head p{margin:0;font-size:.95rem}
.sort{display:flex;align-items:center;gap:10px;font-size:.82rem;color:#777}
.sort select{background:var(--card);border:1px solid var(--line);border-radius:9px;padding:9px 12px;outline:none}
.sort select:focus{border-color:var(--orange)}

.grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:26px}
.card{display:flex;flex-direction:column;gap:18px;min-height:250px;padding:34px;background:var(--card);border:1px solid var(--line);border-radius:var(--radius);transition:.2s}
.card:hover{transform:translateY(-3px);border-color:rgba(255,255,255,.14)}
.logo{width:50px;height:50px;border-radius:12px;background:var(--tint);color:var(--orange);display:grid;place-items:center;overflow:hidden;flex:none}
.logo img{width:100%;height:100%;object-fit:contain}
.card h3{font-size:1.35rem;margin:0 0 4px}
.ind{font-size:.8rem;color:#777}
.card p{margin:0;font-size:.92rem;display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.card-foot{margin-top:auto;display:flex;align-items:center;justify-content:space-between;gap:12px}
.tags{display:flex;gap:7px;flex-wrap:wrap}
.tag{padding:5px 10px;border-radius:999px;border:1px solid var(--line);background:#0a0a0a;color:#aaa;font-size:.72rem}
.open{display:flex;align-items:center;gap:5px;color:var(--orange);font-size:.86rem;font-weight:600;white-space:nowrap}
.open .i{width:16px;height:16px;transition:transform .2s}
.card:hover .open .i{transform:translateX(4px)}

.empty{border:1px dashed rgba(255,255,255,.14);border-radius:var(--radius);padding:70px 28px;text-align:center;background:var(--card)}
.empty .logo{margin:0 auto 22px}
.empty h3{font-size:1.5rem;margin-bottom:10px}
.empty p{max-width:440px;margin:0 auto 26px}
.overlay{display:none}

@media(max-width:1500px){.content{padding:60px 40px 90px}.card{padding:30px}}
@media(max-width:1200px){.grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:960px){
  .app{grid-template-columns:1fr}
  .sidebar{position:fixed;left:0;top:0;width:min(310px,86vw);transform:translateX(-100%);transition:transform .25s ease}
  body.nav-open .sidebar{transform:none}
  .overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:50}
  body.nav-open .overlay{display:block}
  .menu-btn{display:flex}
  .toolbar{padding:0 22px;height:70px}
  .status{display:none}
  .content{padding:48px 22px 72px}
  .stats{margin-bottom:64px}
}
@media(max-width:640px){
  .grid{grid-template-columns:1fr;gap:20px}
  .stats{gap:10px}
  .stat{padding:18px 16px}
  .stat strong{font-size:1.7rem}
  .card{padding:26px;min-height:auto}
  .empty{padding:48px 22px}
}
@media(max-width:480px){.crumb{display:none}}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<div class="app">

  <aside class="sidebar" id="sidebar" aria-label="Directory navigation">
    <a class="brand" href="#/"><b>Knovalab</b><small>Business Directory</small></a>
    <nav class="nav" id="nav"></nav>
    <div class="side-foot">
      <p class="powered">Powered by Knovalab</p>
    </div>
  </aside>
  <div class="overlay" id="overlay"></div>

  <div class="main">
    <header class="toolbar">
      <button class="menu-btn" id="menuBtn" type="button" aria-label="Open navigation" aria-expanded="false"><svg class="i" viewBox="0 0 24 24"><path d="M4 7h16M4 12h16M4 17h16"/></svg></button>
      <div class="crumb" id="crumb"></div>
      <div class="tb-right">
        <span class="status" id="status"></span>
        <a class="btn" href="https://knovalab.in/quote/">Contact us</a>
      </div>
    </header>

    <main class="content">
      <div class="eyebrow" id="eyebrow"></div>
      <h1 id="title"></h1>
      <p class="lede" id="lede"></p>

      <form class="search" id="searchForm" role="search" autocomplete="off">
        <label for="q" style="position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)">Search businesses</label>
        <svg class="i" viewBox="0 0 24 24"><circle cx="11" cy="11" r="7"/><path d="M20 20l-3.5-3.5"/></svg>
        <input id="q" type="search" placeholder="Search businesses, industries, or services...">
        <button class="clear" id="clear" type="button" aria-label="Clear search"><svg class="i" viewBox="0 0 24 24"><path d="M6 6l12 12M18 6L6 18"/></svg></button>
      </form>

      <div class="stats" id="stats"></div>

      <div class="sec-head">
        <div><h2 id="secTitle">Explore Businesses</h2><p id="secCount"></p></div>
        <label class="sort">Sort
          <select id="sort"><option value="name">Name (A–Z)</option><option value="new">Recently added</option></select>
        </label>
      </div>
      <div id="results" aria-live="polite"></div>
    </main>
  </div>
</div>

<script>
/* =====================================================================
   HOW TO ADD A WEBSITE
   1. Find the industry below (each industry has its own  sites:[ ... ]  list).
   2. Copy any one line inside it, paste it as a new line, edit the values.
      Put a comma after every line except the last one in that list.
   3. Save and deploy. Counts, search, stats and the sidebar update by themselves.

   A line looks like this:
   {name:"Business Name", slug:"folder-name", desc:"One short sentence.", tags:["tag one","tag two"], logo:"", added:"2026-10-10"},

   slug  = the folder of the site, so the card opens  business.knovalab.in/<slug>
   url   = optional. Full link for a site on its own domain (e.g. "https://thebravelion.in").
           When set, the card opens this instead of the slug folder.
   logo  = optional image link (leave "" to show the industry icon)
   added = optional date, used for "Recently added" sorting
   ===================================================================== */

const DIRECTORY = [

  { id:"restaurants", name:"Restaurants & Cafes", icon:"M7 3v8M5 3v5a2 2 0 004 0V3M7 11v10M17 3c-2 2-2 6 0 8v10", sites:[
    {name:"Romae Pizzeria", slug:"romaepizzeria", url:"https://business.knovalab.in/romaepizzeria/", desc:"An Italian-inspired pizzeria with a warm, modern website to explore the menu and order on WhatsApp.", tags:["pizzeria","italian"], logo:"https://i.pinimg.com/736x/7e/a3/c6/7ea3c65593a2c4f853f56d0ac2fedab0.jpg", added:"2026-10-22"},
    // ➕ paste new Restaurants & Cafes websites here
  ]},

  { id:"fitness", name:"Fitness & Wellness", icon:"M6 8v8M18 8v8M3 10v4M21 10v4M6 12h12", sites:[
    // ➕ paste new Fitness & Wellness websites here
  ]},

  { id:"education", name:"Education", icon:"M2 9l10-5 10 5-10 5zM6 11v5c3 2 9 2 12 0v-5", sites:[
    {name:"The Brave Lion Pre-Primary School", slug:"thebravelion", url:"https://thebravelion.in", desc:"A joyful, caring pre-primary school for Nursery, Junior KG and Senior KG learners.", tags:["pre-primary","nursery"], logo:"https://i.pinimg.com/736x/f0/e2/e9/f0e2e9a99e4c9d566f665c32e6b5e83e.jpg", added:""},
    // ➕ paste new Education websites here
  ]},

  { id:"retail", name:"Retail & Shopping", icon:"M5 8h14l-1 12H6zM9 8a3 3 0 016 0", sites:[
    // ➕ paste new Retail & Shopping websites here
  ]},

  { id:"realestate", name:"Real Estate", icon:"M4 21V9l8-6 8 6v12zM10 21v-6h4v6", sites:[
    // ➕ paste new Real Estate websites here
  ]},

  { id:"professional", name:"Professional Services", icon:"M3 8h18v12H3zM9 8V5h6v3", sites:[
    // ➕ paste new Professional Services websites here
  ]},

  { id:"beauty", name:"Beauty & Lifestyle", icon:"M12 3l2 5 5 2-5 2-2 5-2-5-5-2 5-2z", sites:[
    // ➕ paste new Beauty & Lifestyle websites here
  ]},

  { id:"technology", name:"Technology", icon:"M4 5h16v11H4zM8 20h8M12 16v4", sites:[
    // ➕ paste new Technology websites here
  ]},

  { id:"travel", name:"Travel & Hospitality", icon:"M21 3L3 10l7 3 3 7z", sites:[
    // ➕ paste new Travel & Hospitality websites here
  ]},

  { id:"other", name:"Other Businesses", icon:"M4 4h7v7H4zM13 4h7v7h-7zM4 13h7v7H4zM13 13h7v7h-7z", sites:[
    {name:"ICONIC", slug:"iconic", desc:"Luxury wedding photography and cinematic films.", tags:["wedding","photography","films"], logo:"https://i.pinimg.com/736x/56/b0/07/56b007965b04f8920b2009bb08ad35e5.jpg", added:""},
    // ➕ paste new Other Businesses websites here
  ]}

];

/* ============ nothing below needs editing ============ */

const INDUSTRIES = DIRECTORY.map(({sites, ...i}) => i);
const BUSINESSES = DIRECTORY.flatMap(d => d.sites.map(s => ({...s, industry:d.id})));

const $ = s => document.querySelector(s);
const ind = id => INDUSTRIES.find(i => i.id === id);
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const norm = s => String(s).toLowerCase().normalize("NFD").replace(/[\u0300-\u036f]/g,"").replace(/[^a-z0-9]+/g," ").trim();
const icon = (d, x="") => `<svg class="i" viewBox="0 0 24 24" ${x}><path d="${d}"/></svg>`;
const HOME = "M3 11l9-8 9 8M5 10v10h14V10", ARROW = "M5 12h14M13 6l6 6-6 6";
const words = b => norm([b.name, ...(b.aliases||[]), ind(b.industry).name, ...(b.tags||[])].join(" ")).split(" ");
const matches = (b, q) => { const t = norm(q).split(" ").filter(Boolean); if(!t.length) return true; const w = words(b); return t.every(x => w.some(y => y.startsWith(x))); };
const age = d => d ? (Date.now() - new Date(d).getTime()) / 864e5 : Infinity;
const plural = (n, a, b) => `${n} ${n===1 ? a : b}`;
const link = b => b.url || "/" + b.slug;

let route = {id:null};
const readRoute = () => { const m = location.hash.match(/^#\/i\/([a-z0-9-]+)/); route = {id: m && ind(m[1]) ? m[1] : null}; };

function renderNav(){
  const a = (href, on, ic, label, n) => `<a href="${href}" class="${on?"active":""}" ${on?'aria-current="page"':""}>${icon(ic)}<span class="name">${esc(label)}</span><span class="count">${n}</span></a>`;
  $("#nav").innerHTML = a("#/", !route.id, HOME, "Overview", BUSINESSES.length)
    + `<div class="nav-label">Industries</div>`
    + INDUSTRIES.map(i => a(`#/i/${i.id}`, route.id===i.id, i.icon, i.name, BUSINESSES.filter(b=>b.industry===i.id).length)).join("");
}

function renderHead(){
  const cur = route.id && ind(route.id), n = cur ? BUSINESSES.filter(b=>b.industry===cur.id).length : 0;
  $("#crumb").innerHTML = `Directory / <b>${esc(cur ? cur.name : "Overview")}</b>`;
  $("#status").textContent = `${plural(BUSINESSES.length,"website","websites")} listed`;
  $("#eyebrow").textContent = cur ? "Industry" : "Knovalab Business Directory";
  $("#title").textContent = cur ? cur.name : "Find a business.";
  $("#lede").textContent = cur ? `${plural(n,"website","websites")} in this industry.` : "Explore websites built for businesses across different industries.";
  $("#secTitle").textContent = cur ? "Websites" : "Explore Businesses";
  document.title = (cur ? cur.name + " — " : "") + "Knovalab Business";
}

function renderStats(){
  $("#stats").hidden = !!route.id;
  const recent = BUSINESSES.filter(b => age(b.added) <= 30).length;
  const third = recent ? ["Added in 30 Days", recent] : ["Industries in Use", new Set(BUSINESSES.map(b=>b.industry)).size];
  $("#stats").innerHTML = [["Total Websites", BUSINESSES.length], ["Industries", INDUSTRIES.length], third]
    .map(([l,v]) => `<div class="stat"><strong>${v}</strong><span>${l}</span></div>`).join("");
}

function card(b){
  const i = ind(b.industry);
  const logo = b.logo ? `<img src="${esc(b.logo)}" alt="" loading="lazy">` : icon(i.icon, 'style="width:24px;height:24px"');
  const tags = (b.tags||[]).slice(0,2).map(t => `<span class="tag">${esc(t)}</span>`).join("");
  return `<a class="card" href="${esc(link(b))}" aria-label="Open ${esc(b.name)} website">
    <div class="logo">${logo}</div>
    <div><h3>${esc(b.name)}</h3><div class="ind">${esc(i.name)}</div></div>
    <p>${esc(b.desc)}</p>
    <div class="card-foot"><div class="tags">${tags}</div><span class="open">Open ${icon(ARROW)}</span></div></a>`;
}

function visible(){
  const list = BUSINESSES.filter(b => (!route.id || b.industry===route.id) && matches(b, $("#q").value));
  return list.sort($("#sort").value==="new"
    ? (a,b) => new Date(b.added||0) - new Date(a.added||0) || a.name.localeCompare(b.name)
    : (a,b) => a.name.localeCompare(b.name));
}

function renderResults(){
  const q = $("#q").value.trim(), list = visible(), cur = route.id && ind(route.id);
  $("#secCount").textContent = q ? `${plural(list.length,"result","results")} for “${q}”` : plural(list.length,"website","websites");
  $("#searchForm").classList.toggle("has-text", !!q);
  if(list.length){ $("#results").innerHTML = `<div class="grid">${list.map(card).join("")}</div>`; return; }
  $("#results").innerHTML = `<div class="empty"><div class="logo">${icon(cur ? cur.icon : "M11 4a7 7 0 100 14 7 7 0 000-14zM20 20l-3.5-3.5", 'style="width:24px;height:24px"')}</div>
    <h3>${q ? "No matching businesses" : `No websites in ${cur ? esc(cur.name) : "the directory"} yet`}</h3>
    <p>${q ? "Try a different name, industry or service." : "New websites will appear here soon."}</p>
    ${q ? `<button class="btn secondary" type="button" id="resetQ">Clear search</button>` : ""}</div>`;
}

function render(){ readRoute(); renderNav(); renderHead(); renderStats(); renderResults(); }

window.addEventListener("hashchange", () => { closeNav(); render(); scrollTo(0,0); });
$("#q").addEventListener("input", renderResults);
$("#sort").addEventListener("change", renderResults);
$("#clear").addEventListener("click", () => { $("#q").value=""; renderResults(); $("#q").focus(); });
$("#searchForm").addEventListener("submit", e => {
  e.preventDefault();
  const list = visible();
  if($("#q").value.trim() && list.length===1) location.href = link(list[0]);   // only opens a registered business
});
document.addEventListener("click", e => {
  if(e.target.closest("#resetQ")){ $("#q").value=""; renderResults(); }
});

function closeNav(){ document.body.classList.remove("nav-open"); $("#menuBtn").setAttribute("aria-expanded","false"); }
$("#menuBtn").addEventListener("click", () => $("#menuBtn").setAttribute("aria-expanded", document.body.classList.toggle("nav-open")));
$("#overlay").addEventListener("click", closeNav);
$("#nav").addEventListener("click", e => { if(e.target.closest("a")) closeNav(); });
document.addEventListener("keydown", e => { if(e.key==="Escape") closeNav(); });

render();
</script>
</body>
</html>
